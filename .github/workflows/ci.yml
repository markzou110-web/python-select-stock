name: CI

on:
  push:
    branches: [main, master, dev, 'codex/**']
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run backend tests
        run: pytest tests/ -q

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        # 现有代码存在 87 个预存 ESLint 错误（主要是 no-explicit-any），
        # 暂设为非阻塞以免 CI 永远为红；清理完成后删除 continue-on-error。
        continue-on-error: true
        run: npm run lint
      - name: Unit tests
        run: npm run test:risk-lines && npm run test:signal-display
