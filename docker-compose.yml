

services:
  redis:
    image: redis:7-alpine
    container_name: alphavision_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    command: redis-server --appendonly yes

  # 预留 PostgreSQL 配置，若本地已安装可注释掉本段
